# Diagnostic : derniers journaux de la fonction serveur (codes de réponse et messages d'erreur, sans données personnelles).
name: Diagnostic
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Nombre d'heures à remonter"
        default: "3"
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Journaux de la fonction
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          HOURS: ${{ github.event.inputs.hours }}
        run: |
          start=$(date -u -d "-${HOURS:-3} hours" +%Y-%m-%dT%H:%M:%SZ); end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          q() { curl -sS -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" -H "Authorization: Bearer $TOKEN" \
                 --data-urlencode "iso_timestamp_start=$start" --data-urlencode "iso_timestamp_end=$end" --data-urlencode "sql=$1"; echo; }
          note() { t="$1"; m=$(cat | head -c 60000); m="${m//'%'/'%25'}"; m="${m//$'\n'/'%0A'}"; echo "::notice title=$t::$m"; }
          # Journaux de la fonction : route, statut, durée, et messages d'erreur (aucune donnée personnelle n'y est écrite).
          q "select timestamp, source_name, event_message from logs where source_name in ('function_edge_logs', 'function_logs') order by timestamp desc limit 120" > out.json
          jq -r '.result[]? | "\(.timestamp)  \(.source_name | sub("function_"; ""))  \(.event_message[0:300] | gsub("https?://[^/ ]+"; ""))"' out.json | note "Journaux" || true
          head -c 800 out.json | note "Brut"
