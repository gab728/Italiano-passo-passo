<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Italiano passo passo</title>
<meta name="description" content="Apprendre l'italien pas à pas, en lisant, en écrivant et en parlant avec Claude.">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Italiano">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Noto+Serif+Hebrew:wght@400;700&family=Noto+Sans+Hebrew:wght@400;600&display=swap">
<link rel="preload" href="fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>html.i18n-wait body{visibility:hidden}
/* Layout : une colonne étroite. L'accueil montre la séance du jour puis le programme (niveaux > unités > leçons) ; chaque leçon s'ouvre pas à pas. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --ink:#11272B; --muted:#56696B; --line:#CBD6D2;
  --brand:#0A5C55; --brand-ink:#FFFFFF; --brand-soft:#DCEBE7;
  --board:#11272B; --board-ink:#F4C430; --board-dim:#9FB3B1;
  --ok:#1B7A43; --ok-bg:#DDF1E4; --ko:#B3372C; --ko-bg:#F8E1DD;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1517; --surface:#152225; --ink:#E6EEEC; --muted:#93A6A6; --line:#2A3B3E;
  --brand:#3FB8A9; --brand-ink:#06201D; --brand-soft:#17302E;
  --board:#060C0D; --board-ink:#F4C430; --board-dim:#7E9291;
  --ok:#5FD08A; --ok-bg:#143322; --ko:#F08A7C; --ko-bg:#3A1B17; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C1517; --surface:#152225; --ink:#E6EEEC; --muted:#93A6A6; --line:#2A3B3E;
  --brand:#3FB8A9; --brand-ink:#06201D; --brand-soft:#17302E;
  --board:#060C0D; --board-ink:#F4C430; --board-dim:#7E9291;
  --ok:#5FD08A; --ok-bg:#143322; --ko:#F08A7C; --ko-bg:#3A1B17; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);padding-inline:16px;padding-block:16px 48px}
#app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}

/* Tableau des départs */
.board{background:var(--board);color:var(--board-dim);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px}
.board .row{font:500 12px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between}
.board .row b{color:var(--board-ink);font-weight:500}
.board h1{color:#F3F6F5;font-size:clamp(34px,10vw,48px);font-weight:700;letter-spacing:-.02em}
.board p{color:#C9D5D3;font-size:16px;max-width:46ch}

/* Ligne */
.linea{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:52px 22px 1fr;gap:0 10px;width:100%;text-align:left;background:none;border:0;padding:0}
.stop .time{font:500 13px/1 var(--mono);color:var(--muted);padding-top:20px;text-align:right;font-variant-numeric:tabular-nums}
.stop .rail{position:relative;display:flex;justify-content:center}
.stop .rail::before{content:"";position:absolute;top:0;bottom:0;width:4px;background:var(--line)}
li:first-child .stop .rail::before{top:24px} li:last-child .stop .rail::before{bottom:calc(100% - 24px)}
.stop .dot{position:relative;margin-top:15px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:4px solid var(--brand)}
.stop.done .dot{background:var(--brand)}
.stop .card{min-width:0;padding:14px 0 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
li:last-child .stop .card{border-bottom:0}
.stop h2{font-size:21px;font-weight:700}
.stop:hover h2{color:var(--brand)}
.stop .topic{color:var(--muted);font-size:15.5px}
.stop .state{font:500 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-top:4px}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px;max-width:220px}
.meter i{display:block;height:100%;background:var(--brand)}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-size:21px}
.grp{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);font-weight:700}
.chip:disabled{opacity:.45;cursor:default}
.word{font:700 30px/1.2 var(--display);overflow-wrap:anywhere}
.bar .sub{flex-wrap:wrap}
.nb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.nb li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.nb .it{font-weight:700;font-size:18px;overflow-wrap:anywhere;min-width:0}
.nb .tr{grid-column:1;color:var(--muted);overflow-wrap:anywhere;min-width:0}
.nb .acts{grid-row:1 / span 2;grid-column:2;display:flex;gap:6px;align-items:center}
.nb .acts button{min-width:44px;min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0 10px;font-size:14px}
.nb .acts svg{width:18px;height:18px}
.tag{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ok);margin-left:8px;white-space:nowrap}
.addw{display:flex;flex-direction:column;gap:8px}
.addw .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addw input{font:inherit;padding:11px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0}
.w{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;border-bottom:1px dotted var(--muted);cursor:pointer}
.gloss{margin-top:6px;padding:10px 12px;border-radius:8px;background:var(--brand-soft);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:16px}
.gloss b,.gloss span{min-width:0;overflow-wrap:anywhere}
.gloss .btn{min-height:40px;padding:6px 12px;font-size:15px}
.why{display:flex;flex-direction:column;gap:8px}.why p{white-space:pre-line}
.dict{font-size:19px;font-weight:700}.dict .bad{color:var(--ko);text-decoration:underline wavy;text-underline-offset:4px}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:10px 14px;border-radius:14px;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:2px}
.bub.ai{align-self:flex-start;background:var(--surface);border:1.5px solid var(--line)}
.bub.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink)}
.tip{background:var(--brand-soft);border-radius:8px;padding:12px 14px;font-size:16px}
.hint{white-space:pre-line;background:var(--surface);border:1.5px dashed var(--line);border-radius:8px;padding:12px 14px;font-size:16px}
.scn{display:flex;flex-direction:column;gap:3px}.scn span{color:var(--muted);font-size:15px}
.scn .state{font:500 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.corr{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.corr .said{color:var(--ko);text-decoration:line-through;text-decoration-thickness:1px}.corr .better{font-weight:700}
.body>h3{font-size:19px;margin-top:8px}
.req{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.req li{display:flex;gap:10px;align-items:baseline;justify-content:space-between;font-size:15.5px}
.req li span{min-width:0;overflow-wrap:anywhere}
.panel textarea{font:inherit;padding:11px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-height:84px;resize:vertical}
.speaknote{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom, 0px));z-index:9;max-width:560px;margin:0 auto;background:var(--board);color:#F3F6F5;border-radius:8px;padding:12px 14px;font-size:15px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.board .bar2{height:6px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
.board .bar2 i{display:block;height:100%;background:var(--board-ink)}
.today{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.today h2,.plan>h2{font-size:22px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:flex;align-items:center;gap:10px 14px;justify-content:space-between;flex-wrap:wrap}
.steps li>div{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.steps li span{color:var(--muted);font-size:15px}
.steps .btn{min-height:44px;flex:0 0 auto;min-width:120px}
.plan{display:flex;flex-direction:column;gap:22px}
.lvl{display:flex;flex-direction:column}
.lvl-h{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.lvl-h h3{font-size:20px}
.lvl-h span,details.unit summary span{font:500 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
details.unit{border-bottom:1px solid var(--line)}
details.unit summary{cursor:pointer;list-style:none;padding:13px 0;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
details.unit summary::-webkit-details-marker{display:none}
details.unit summary b{font-family:var(--display);font-size:17px;min-width:0}
details.unit summary b::before{content:"+";display:inline-block;width:1.1em;color:var(--brand)}
details.unit[open] summary b::before{content:"–"}
details.unit summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.unit .goal{color:var(--muted);font-size:15.5px;padding:0 0 8px 1.1em}
.stop.todo h2{color:var(--muted)}
.stop.next .dot{box-shadow:0 0 0 5px var(--brand-soft)}
.stop.next h2{color:var(--brand)}
.aud-state{font:700 clamp(26px,8vw,36px)/1.15 var(--display);text-wrap:balance;padding:12px 0}
.btn.aud-main{min-height:120px;font-size:26px;border-radius:12px}
select{font:inherit;font-size:16px;padding:12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-height:48px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);font-weight:700}
.body>.tip{max-width:62ch}
.cj-q{font:inherit;font-size:18px;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.cj-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cj-item{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:12px;align-items:baseline;min-height:48px}
.cj-item b{font-size:18px;white-space:nowrap}.cj-item>span{color:var(--muted);text-align:right;font-size:15px;min-width:0}
.cj-item:hover b{color:var(--brand)}
.cj-h{font-size:clamp(30px,9vw,40px)}
.cj-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cj-facts div{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.cj-facts b{overflow-wrap:anywhere}
.cj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cj-card{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cj-th{display:flex;justify-content:space-between;gap:4px 8px;align-items:baseline;flex-wrap:wrap}
.cj-th h3{font-size:17px}
.cj-card table{font-size:16px}.cj-card td{white-space:normal;padding:5px 10px 5px 0;overflow-wrap:anywhere}
.cj-card td:first-child{font-weight:400;color:var(--muted);width:6.2em}.cj-card td:last-child{font-weight:700}
.miss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.miss li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:2px 10px}
.miss b{flex:1 1 45%;min-width:0}.miss span{flex:1 1 45%;min-width:0;color:var(--muted)}
.sync{font:500 12px/1.5 var(--mono);letter-spacing:.04em;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.sync::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--line);transform:translateY(-1px)}
.sync[data-sync="ok"]::before{background:var(--ok)}
.sync[data-sync="err"],.sync[data-sync="local"]{color:var(--ko)}
.sync[data-sync="err"]::before,.sync[data-sync="local"]::before{background:var(--ko)}
.bar .sync:not([data-sync="err"]){display:none}
.notes{color:var(--muted);font-size:15px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:16px}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);text-decoration:underline;text-underline-offset:3px;font-size:15px;align-self:flex-start;min-height:32px}

/* Cours */
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2;padding:8px 0 10px;display:flex;flex-direction:column;gap:8px}
.bar .top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.bar .where{font:500 12px/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);min-width:0;text-align:right}
.bar .sub{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.bar .sub .count{margin-left:auto;font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);transition:width .25s}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
.kind{font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.body{display:flex;flex-direction:column;gap:16px}
.fr{color:var(--muted);font-size:16px}
.q{font-size:21px;line-height:1.4;font-weight:700}
.q small{font-weight:400;color:var(--muted);font-size:.8em}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--brand);height:1em;vertical-align:baseline;margin:0 .1em}
.btn{min-height:50px;padding:10px 18px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn:disabled{opacity:.5;cursor:default}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:52px;text-align:left;padding:12px 16px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface)}
.opt:disabled{cursor:default}
.opt.ok,.chip.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.opt.ko,.chip.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.field{display:flex;flex-direction:column;gap:10px}
.field input{font:inherit;font-size:20px;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{min-width:42px;min-height:42px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);font-size:18px}
.rowb{display:flex;flex-wrap:wrap;gap:10px}
.rowb .btn{flex:1 1 140px}
.fb{border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--ok-bg)} .fb.ko{background:var(--ko-bg)}
.fb.ok strong{color:var(--ok)} .fb.ko strong{color:var(--ko)}
.fb p{font-size:16px}
.say{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;color:var(--brand);font-size:15px;min-height:36px;align-self:flex-start}
.say svg{width:18px;height:18px;flex:none}
.tray{min-height:60px;border-bottom:2px dashed var(--line);padding-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:17px}
.chip.sel{border-color:var(--brand);background:var(--brand-soft)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.pairs .chip{text-align:left;overflow-wrap:anywhere}
.flash{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:28px 18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;min-height:190px;justify-content:center}
.flash .it{font:700 28px/1.2 var(--display)}
.flash .tr{font-size:19px;color:var(--muted)}
.flash .say{align-self:center}
.count{font:500 12px/1 var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.dlg{display:flex;flex-direction:column;gap:14px}
.dlg .ln{display:flex;flex-direction:column;gap:2px}
.dlg .who{font:500 12px/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.dlg .it{min-width:0}
.dlg .tr{color:var(--muted);font-size:15.5px;font-style:italic}

/* Leçons */
.lesson{display:flex;flex-direction:column;gap:14px}
.lesson h2{font-size:26px}
.lesson h3{font-size:18px;margin-top:6px}
.lesson p{max-width:62ch}
.lesson em{font-style:normal;font-weight:700;color:var(--brand)}
.lesson .ex{border-left:3px solid var(--brand);padding-left:12px}
.lesson .ex span{display:block;margin-top:4px;color:var(--muted);font-size:15.5px}
.swipe{font:500 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:-8px}

.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:15.5px;width:100%}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:500 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td:first-child{font-weight:700}
.end{display:flex;flex-direction:column;gap:16px}
.end .score{font:700 56px/1 var(--display);color:var(--brand);font-variant-numeric:tabular-nums}
</style>

<body>
<div id="gate" class="gate" hidden></div>
